version: 2.1

jobs:
  seldrune-ci:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Binary search F401 group A
          command: |
            ruff check --select F401 --fix backend/app/services/one_go_controller.py
            git diff -- backend/app/services/one_go_controller.py | grep -Eq "Any|UUID|select|Session|AgentStatus|TaskStatus|ToolRunStatus|Agent|GovernancePolicy|TaskEvent|ToolRun"

workflows:
  version: 2
  validate:
    jobs:
      - seldrune-ci
