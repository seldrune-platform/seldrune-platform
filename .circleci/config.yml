version: 2.1

jobs:
  seldrune-ci:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldrune_ci
    resource_class: small
    environment:
      SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_MODEL_PROVIDER: mock

    steps:
      - checkout
      - restore_cache:
          keys:
            - seldrune-pip-v1-{{ checksum "pyproject.toml" }}
            - seldrune-pip-v1-
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Lint isolation
          command: ruff check .

workflows:
  version: 2
  validate:
    jobs:
      - seldrune-ci
