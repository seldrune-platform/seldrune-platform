version: 2.1

jobs:
  seldrune-ci:
    docker:
      - image: cimg/python:3.12
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldrune_ci
    resource_class: small
    environment:
      SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_CI_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_CI_RECEIPT_PATH: /tmp/seldrune-ci-receipt.json
      SELDRUNE_MODEL_PROVIDER: mock

    steps:
      - checkout

      - restore_cache:
          keys:
            - seldrune-pip-v2-{{ checksum "pyproject.toml" }}
            - seldrune-pip-v2-

      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"

      - save_cache:
          key: seldrune-pip-v2-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip

      - run:
          name: Portable verification
          command: |
            SELDRUNE_CI_RELEASE_SHA=<< pipeline.git.revision >> \
              bash scripts/ci_verify.sh

      - store_artifacts:
          path: /tmp/seldrune-ci-receipt.json
          destination: seldrune-ci-receipt.json

workflows:
  version: 2
  validate:
    jobs:
      - seldrune-ci
