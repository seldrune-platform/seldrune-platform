version: 2.1

jobs:
  seldrune-ci:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: Check F401 autofix diff
          command: |
            ruff check --select F401 --fix --unsafe-fixes backend/app/services/one_go_controller.py || true
            test -n "$(git diff -- backend/app/services/one_go_controller.py)"

workflows:
  version: 2
  validate:
    jobs:
      - seldrune-ci
