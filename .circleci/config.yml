version: 2.1

jobs:
  seldrune-ci:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install
          command: |
            python -m pip install --upgrade pip
            pip install -e ".[dev]"
      - run:
          name: One-Go controller lint diagnostic
          command: ruff check backend/app/services/one_go_controller.py

workflows:
  version: 2
  validate:
    jobs:
      - seldrune-ci
