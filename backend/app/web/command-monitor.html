<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seldrune Command Monitor</title><link rel="stylesheet" href="/console-assets/console.css"><style>body{background:var(--paper)}.monitor-shell{max-width:1180px;margin:0 auto;padding:28px 18px 60px}.monitor-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.monitor-head h1{font-size:clamp(34px,6vw,62px);margin-bottom:10px}.monitor-head p{color:var(--muted);max-width:680px}.monitor-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.monitor-summary article,.monitor-card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.monitor-summary small,.monitor-stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.monitor-summary strong{display:block;font-family:Georgia,serif;font-size:28px;margin-top:8px}.monitor-list{display:grid;gap:12px}.monitor-card h2{font-family:inherit;font-weight:760;font-size:18px;margin:0 0 10px}.monitor-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.monitor-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.monitor-stat{background:#f7f9f5;border:1px solid #e7ece8;border-radius:9px;padding:10px;min-width:0}.monitor-stat strong{display:block;font-size:12px;margin-top:5px;overflow-wrap:anywhere}.live{color:var(--green)}.fallback{color:#9a6710}.monitor-error{padding:18px;background:#fff0c7;border-radius:12px}.monitor-actions{display:flex;gap:8px;flex-wrap:wrap}.monitor-actions a{display:inline-block;text-decoration:none;border-radius:9px;padding:12px 17px;background:var(--ink);color:#fff;font-weight:700}.monitor-actions a.secondary{background:white;color:var(--ink);border:1px solid var(--line)}@media(max-width:760px){.monitor-summary{grid-template-columns:1fr 1fr}.monitor-grid{grid-template-columns:1fr 1fr}.monitor-head{display:block}.monitor-actions{margin-top:12px}}@media(max-width:480px){.monitor-summary,.monitor-grid{grid-template-columns:1fr}}</style></head><body><main class="monitor-shell"><header class="monitor-head"><div><p class="eyebrow">SELDRUNE OBSERVABILITY</p><h1>Command Monitor</h1><p>Live model, agent routing, token usage, recorded execution cost, and routing confidence for every strategic command.</p></div><div class="monitor-actions"><a href="/console">Owner Console</a><a class="secondary" href="#" id="monitor-refresh">Refresh</a></div></header><section class="monitor-summary"><article><small>Commands</small><strong id="m-total">—</strong></article><article><small>Live AI</small><strong id="m-live">—</strong></article><article><small>Tokens</small><strong id="m-tokens">—</strong></article><article><small>Recorded cost</small><strong id="m-cost">—</strong></article></section><div id="monitor-message"></div><section id="monitor-list" class="monitor-list"></section></main><script src="/console-assets/command-monitor.js" defer></script></body></html>
