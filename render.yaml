services:
  - type: web
    name: seldrune-platform
    runtime: docker
    healthCheckPath: /api/v1/ready
    envVars:
      - key: SELDRUNE_ENVIRONMENT
        value: production
      - key: SELDRUNE_AUTH_SECRET_KEY
        generateValue: true
      - key: SELDRUNE_ENABLE_DOCS
        value: false
      - key: SELDRUNE_PUBLIC_APP_URL
        value: https://seldrune-platform.onrender.com
      - key: SELDRUNE_DATABASE_URL
        fromDatabase:
          name: seldrune-db
          property: connectionString
      - key: SELDRUNE_MODEL_PROVIDER
        value: openai
      - key: SELDRUNE_MODEL_DEFAULT
        value: gpt-5.6-sol
      - key: SELDRUNE_MODEL_ECONOMY
        value: gpt-5.6-luna
      - key: SELDRUNE_MODEL_BALANCED
        value: gpt-5.6-terra
      - key: SELDRUNE_MODEL_PREMIUM
        value: gpt-5.6-sol
      - key: SELDRUNE_AI_COST_GOVERNOR_ENABLED
        value: true
      - key: SELDRUNE_AI_REQUEST_MAX_USD
        value: 0.04
      - key: SELDRUNE_AI_DAILY_MAX_USD
        value: 1.0
      - key: SELDRUNE_AI_MONTHLY_MAX_USD
        value: 15.0
      - key: SELDRUNE_AI_SPEND_WARNING_RATIO
        value: 0.70
      - key: SELDRUNE_AI_CONSERVATION_RATIO
        value: 0.80
      - key: SELDRUNE_AI_IMAGE_JOB_MAX_USD
        value: 0.08
      - key: SELDRUNE_AI_VIDEO_JOB_MAX_USD
        value: 0.40
      - key: SELDRUNE_AI_VIDEO_DEFAULT_SECONDS
        value: 4
      - key: SELDRUNE_AI_VIDEO_MAX_SECONDS
        value: 6
      - key: SELDRUNE_AI_MEDIA_BATCH_PREFERRED
        value: true
      - key: SELDRUNE_AI_PDF_REQUEST_MAX_USD
        value: 0.04
      - key: SELDRUNE_AI_PDF_MAX_TOTAL_USD
        value: 0.10
      - key: SELDRUNE_AI_PDF_MAX_ATTEMPTS
        value: 2
      - key: SELDRUNE_AI_PDF_MAX_OUTPUT_TOKENS
        value: 2200
      - key: SELDRUNE_PDF_BRAIN_ENABLED
        value: true
      - key: SELDRUNE_PDF_BRAIN_MIN_CONFIDENCE
        value: 0.78
      - key: SELDRUNE_PDF_LOCAL_OCR_ENABLED
        value: true
      - key: SELDRUNE_PDF_EXTERNAL_FALLBACK_ENABLED
        value: false
      - key: SELDRUNE_AI_IMAGE_DETAIL
        value: low
      - key: SELDRUNE_AI_PDF_DETAIL
        value: low
      - key: SELDRUNE_AI_PROMPT_CACHE_ENABLED
        value: true
      - key: SELDRUNE_AI_EXACT_TOKEN_PREFLIGHT
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SELDRUNE_GEMINI_API_KEY
        sync: false
      - key: SELDRUNE_ANTHROPIC_API_KEY
        sync: false
      - key: SELDRUNE_GMAIL_TOOL_CREDENTIAL
        sync: false
      - key: SELDRUNE_GITHUB_TOOL_TOKEN
        sync: false
      - key: SELDRUNE_GITHUB_DEFAULT_OWNER
        value: seldrune-platform
      - key: SELDRUNE_GITHUB_DEFAULT_REPO
        value: seldrune-platform
      - key: SELDRUNE_GITHUB_DEFAULT_REF
        value: main
      - key: SELDRUNE_RENDER_API_KEY
        sync: false
      - key: SELDRUNE_RENDER_DEFAULT_SERVICE_ID
        sync: false
      - key: SELDRUNE_AGENT_AUTO_GRANT_PRODUCTION_TOOLS
        value: true
      - key: SELDRUNE_OWNER_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: SELDRUNE_LIVESHIFT_WORKER_URL
        sync: false
      - key: SELDRUNE_LIVESHIFT_WORKER_TOKEN
        generateValue: true
      - key: SELDRUNE_LIVE_PROFILE_AUTHORIZER_TOKEN
        generateValue: true
      - key: SELDRUNE_FACESWAP_WORKER_URL
        sync: false
      - key: SELDRUNE_FACESWAP_WORKER_TOKEN
        sync: false
  - type: worker
    name: seldrune-life-worker
    runtime: docker
    dockerCommand: python -m backend.app.workers.life_worker
    envVars:
      - key: SELDRUNE_ENVIRONMENT
        value: production
      - key: SELDRUNE_AUTH_SECRET_KEY
        generateValue: true
      - key: SELDRUNE_DATABASE_URL
        fromDatabase:
          name: seldrune-db
          property: connectionString
      - key: SELDRUNE_MODEL_PROVIDER
        value: openai
      - key: SELDRUNE_MODEL_DEFAULT
        value: gpt-5.6-sol
      - key: SELDRUNE_MODEL_ECONOMY
        value: gpt-5.6-luna
      - key: SELDRUNE_MODEL_BALANCED
        value: gpt-5.6-terra
      - key: SELDRUNE_MODEL_PREMIUM
        value: gpt-5.6-sol
      - key: SELDRUNE_AI_COST_GOVERNOR_ENABLED
        value: true
      - key: SELDRUNE_AI_REQUEST_MAX_USD
        value: 0.04
      - key: SELDRUNE_AI_DAILY_MAX_USD
        value: 1.0
      - key: SELDRUNE_AI_MONTHLY_MAX_USD
        value: 15.0
      - key: SELDRUNE_AI_SPEND_WARNING_RATIO
        value: 0.70
      - key: SELDRUNE_AI_CONSERVATION_RATIO
        value: 0.80
      - key: SELDRUNE_AI_IMAGE_JOB_MAX_USD
        value: 0.08
      - key: SELDRUNE_AI_VIDEO_JOB_MAX_USD
        value: 0.40
      - key: SELDRUNE_AI_VIDEO_DEFAULT_SECONDS
        value: 4
      - key: SELDRUNE_AI_VIDEO_MAX_SECONDS
        value: 6
      - key: SELDRUNE_AI_MEDIA_BATCH_PREFERRED
        value: true
      - key: SELDRUNE_AI_PDF_REQUEST_MAX_USD
        value: 0.04
      - key: SELDRUNE_AI_PDF_MAX_TOTAL_USD
        value: 0.10
      - key: SELDRUNE_AI_PDF_MAX_ATTEMPTS
        value: 2
      - key: SELDRUNE_AI_PDF_MAX_OUTPUT_TOKENS
        value: 2200
      - key: SELDRUNE_PDF_BRAIN_ENABLED
        value: true
      - key: SELDRUNE_PDF_BRAIN_MIN_CONFIDENCE
        value: 0.78
      - key: SELDRUNE_PDF_LOCAL_OCR_ENABLED
        value: true
      - key: SELDRUNE_PDF_EXTERNAL_FALLBACK_ENABLED
        value: false
      - key: SELDRUNE_AI_IMAGE_DETAIL
        value: low
      - key: SELDRUNE_AI_PDF_DETAIL
        value: low
      - key: SELDRUNE_AI_PROMPT_CACHE_ENABLED
        value: true
      - key: SELDRUNE_AI_EXACT_TOKEN_PREFLIGHT
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SELDRUNE_GMAIL_TOOL_CREDENTIAL
        sync: false
      - key: SELDRUNE_GITHUB_TOOL_TOKEN
        sync: false
      - key: SELDRUNE_GITHUB_DEFAULT_OWNER
        value: seldrune-platform
      - key: SELDRUNE_GITHUB_DEFAULT_REPO
        value: seldrune-platform
      - key: SELDRUNE_GITHUB_DEFAULT_REF
        value: main
      - key: SELDRUNE_RENDER_API_KEY
        sync: false
      - key: SELDRUNE_RENDER_DEFAULT_SERVICE_ID
        sync: false
      - key: SELDRUNE_AGENT_AUTO_GRANT_PRODUCTION_TOOLS
        value: true
      - key: SELDRUNE_LIFE_WORKER_INTERVAL_SECONDS
        value: 20
  - type: web
    name: seldrune-live-gateway
    runtime: docker
    plan: 1c-2g
    region: oregon
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.webrtc-gateway
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SELDRUNE_PROFILE_AUTHORIZER
        value: services.live_media.seldrune_profile_authorizer:authorize_profiles
      - key: SELDRUNE_PROFILE_AUTHORIZATION_URL
        fromService:
          name: seldrune-platform
          type: web
          envVarKey: SELDRUNE_PUBLIC_APP_URL
      - key: SELDRUNE_PROFILE_AUTHORIZATION_TOKEN
        fromService:
          name: seldrune-platform
          type: web
          envVarKey: SELDRUNE_LIVE_PROFILE_AUTHORIZER_TOKEN
      - key: SELDRUNE_LIVESHIFT_WORKER_TOKEN
        fromService:
          name: seldrune-platform
          type: web
          envVarKey: SELDRUNE_LIVESHIFT_WORKER_TOKEN
      - key: SELDRUNE_LIVE_WORKER_TOKEN
        sync: false
      - key: SELDRUNE_LIVE_TICKET_SECRET
        sync: false
      - key: SELDRUNE_LIVE_WORKER_HOST
        sync: false
      - key: SELDRUNE_LIVE_WORKER_PORT
        value: "8765"
      - key: SELDRUNE_LIVE_WORKER_TLS_NAME
        sync: false
      - key: SELDRUNE_LIVE_WORKER_REGION
        sync: false
      - key: SELDRUNE_LIVE_TURN_PROVIDER
        value: cloudflare
      - key: SELDRUNE_LIVE_GATEWAY_TURN_TRANSPORT
        value: tcp
      - key: SELDRUNE_CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: SELDRUNE_CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: SELDRUNE_LIVE_TURN_CREDENTIAL_TTL_SECONDS
        value: "3900"
      - key: SELDRUNE_LIVE_MAX_SESSIONS
        value: "1"
      - key: SELDRUNE_LIVE_MAX_INFLIGHT
        value: "2"
      - key: SELDRUNE_LIVE_SESSION_TTL_SECONDS
        value: "3600"
databases:
  - name: seldrune-db
    databaseName: seldrune
    user: seldrune
