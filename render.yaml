services:
  - type: web
    name: seldrune-platform
    runtime: docker
    healthCheckPath: /api/v1/status
    envVars:
      - key: SELDRUNE_ENVIRONMENT
        value: production
      - key: SELDRUNE_AUTH_SECRET_KEY
        generateValue: true
      - key: SELDRUNE_ENABLE_DOCS
        value: false
      - key: SELDRUNE_DATABASE_URL
        fromDatabase:
          name: seldrune-db
          property: connectionString
      - key: SELDRUNE_MODEL_PROVIDER
        value: openai
      - key: SELDRUNE_MODEL_DEFAULT
        value: gpt-5.6-sol
      - key: OPENAI_API_KEY
        sync: false
      - key: SELDRUNE_OWNER_PUSH_VAPID_PUBLIC_KEY
        sync: false
databases:
  - name: seldrune-db
    databaseName: seldrune
    user: seldrune
