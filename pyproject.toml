[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seldrune-platform"
version = "1.4.0"
description = "Core platform for the Seldrune AI-native virtual organization."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "boto3>=1.35,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "openai>=3.0,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]<1.0,>=0.2",
  "pymupdf>=1.26,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt>=2.10,<3.0",
  "pywebpush>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/services/tool_gateway.py" = ["UP035"]
"backend/app/api/routes/research.py" = ["E501"]
"backend/app/models/research_connector.py" = ["E501"]
"backend/app/services/research_engine.py" = ["E501"]
"migrations/versions/0009_live_connectors.py" = ["E501"]
"migrations/versions/0010_organization_kernel.py" = ["E501"]
