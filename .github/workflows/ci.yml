# Temporary CircleCI diagnostic split for the legacy S-Z pytest failure.
name: ci

on:
  workflow_dispatch:

jobs:
  pytest-s:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test S group
        run: pytest -q tests/test_s*.py

  pytest-t-z:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test T through Z excluding UNARCHI
        run: pytest -q tests/test_[t-z]*.py --ignore=tests/test_unarchi_engine.py --ignore=tests/test_unarchi_benchmark.py
