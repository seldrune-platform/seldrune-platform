# Temporary CircleCI diagnostic split for legacy T-group pytest failure.
name: ci

on:
  workflow_dispatch:

jobs:
  test-task-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q tests/test_task_engine.py

  test-tool-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q tests/test_tool_bootstrap.py

  test-tool-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q tests/test_tool_gateway.py

  test-tool-input-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -q tests/test_tool_input_defaults.py
