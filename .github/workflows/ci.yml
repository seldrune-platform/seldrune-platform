# Repository-native CI fallback.
# Mirrors the CircleCI evidence gate so PRs remain verifiable when the external
# CircleCI runner/account is unavailable.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldrune_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seldrune_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_MODEL_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: PostgreSQL migration smoke
        run: alembic upgrade head

      - name: Production startup health smoke
        env:
          SELDRUNE_ENVIRONMENT: production
          SELDRUNE_AUTH_SECRET_KEY: ci-production-secret-key-longer-than-thirty-two-characters
          SELDRUNE_MODEL_PROVIDER: mock
          SELDRUNE_MODEL_DEFAULT: mock-v1
          SELDRUNE_RELEASE_SHA: ${{ github.sha }}
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/seldrune-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready > /tmp/seldrune-ready.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/seldrune-uvicorn.log
              exit 1
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          import os

          with open('/tmp/seldrune-ready.json', encoding='utf-8') as handle:
              status = json.load(handle)

          schema = status['checks']['schema']
          assert status['ready'] is True
          assert status['status'] == 'ready'
          assert status['environment'] == 'production'
          assert status['checks']['database']['status'] == 'ok'
          assert schema['status'] == 'ok'
          assert schema['schema_current'] is True
          assert schema['current_revision'] == schema['expected_revision']
          assert status['checks']['model_provider']['status'] == 'ok'
          assert status['checks']['model_provider']['provider'] == 'mock'
          assert status['checks']['model_provider']['live_ai'] is False
          assert status['release'] == {
              'sha': os.environ['SELDRUNE_RELEASE_SHA'],
              'source': 'seldrune',
          }
          PY
