# CircleCI GitHub App Cloud validates pushes; GitHub Actions is a manual fallback.
name: ci

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  pytest-unarchi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test UNARCHI
        run: pytest -q tests/test_unarchi_engine.py tests/test_unarchi_benchmark.py

  pytest-a-m:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test A through M
        run: pytest -q tests/test_[a-m]*.py

  pytest-n-z:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test N through Z excluding UNARCHI
        run: pytest -q tests/test_[n-z]*.py --ignore=tests/test_unarchi_engine.py --ignore=tests/test_unarchi_benchmark.py

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Start PostgreSQL
        run: |
          docker run --rm -d --name seldrune-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=seldrune_ci \
            -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            if docker exec seldrune-ci-postgres pg_isready -U postgres -d seldrune_ci; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs seldrune-ci-postgres
              exit 1
            fi
            sleep 1
          done
      - name: PostgreSQL migration smoke
        env:
          SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
          SELDRUNE_MODEL_PROVIDER: mock
        run: alembic upgrade head
