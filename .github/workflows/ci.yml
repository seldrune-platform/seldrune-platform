# Repository-native CI fallback.
# Uses the same portable evidence gate as CircleCI and external providers.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seldrune_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seldrune_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_CI_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/seldrune_ci
      SELDRUNE_CI_RECEIPT_PATH: /tmp/seldrune-ci-receipt.json
      SELDRUNE_MODEL_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Portable verification
        env:
          SELDRUNE_CI_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/ci_verify.sh

      - name: Upload CI receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seldrune-ci-receipt
          path: /tmp/seldrune-ci-receipt.json
          if-no-files-found: error
