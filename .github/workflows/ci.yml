# CircleCI GitHub App Cloud validates pushes; GitHub Actions is a manual fallback.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Start PostgreSQL
        run: |
          docker run --rm -d --name seldrune-ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=seldrune_ci \
            -p 5432:5432 postgres:16

          for attempt in $(seq 1 30); do
            if docker exec seldrune-ci-postgres pg_isready -U postgres -d seldrune_ci; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs seldrune-ci-postgres
              exit 1
            fi
            sleep 1
          done


      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: PostgreSQL migration smoke
        env:
          SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
          SELDRUNE_MODEL_PROVIDER: mock
        run: alembic upgrade head

      - name: Production startup health smoke
        env:
          SELDRUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/seldrune_ci
          SELDRUNE_ENVIRONMENT: production
          SELDRUNE_AUTH_SECRET_KEY: ci-production-secret-key-longer-than-thirty-two-characters
          SELDRUNE_MODEL_PROVIDER: openai
          SELDRUNE_MODEL_DEFAULT: gpt-5.6-sol
          SELDRUNE_RELEASE_SHA: ${{ github.sha }}
          OPENAI_API_KEY: ci-placeholder-key
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/seldrune-uvicorn.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/ready > /tmp/seldrune-ready.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/seldrune-uvicorn.log
              curl --silent http://127.0.0.1:8000/api/v1/status || true
              exit 1
            fi
            sleep 1
          done

          cat /tmp/seldrune-ready.json
          python - <<'PY'
          import json
          import os

          with open('/tmp/seldrune-ready.json', encoding='utf-8') as handle:
              status = json.load(handle)

          schema = status['checks']['schema']
          assert status['ready'] is True
          assert status['status'] == 'ready'
          assert status['environment'] == 'production'
          assert status['checks']['database']['status'] == 'ok'
          assert schema['status'] == 'ok'
          assert schema['schema_current'] is True
          assert schema['current_revision'] == schema['expected_revision']
          assert status['checks']['model_provider']['status'] == 'ok'
          assert status['checks']['model_provider']['live_ai'] is True
          assert status['release'] == {
              'sha': os.environ['SELDRUNE_RELEASE_SHA'],
              'source': 'seldrune',
          }
          PY
