name: temp-astra-runpod-review

on:
  pull_request:
    paths:
      - ".github/workflows/temp-astra-runpod-review.yml"

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke fixed Seldrune Astra review
        env:
          BRIDGE_TOKEN: "SauKF2knd-gPxTo3kEVVtd7jB6gKx_lqwPhZ6qYQbewmO2yFi4j-UTmOtUZ36o4G"
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = urllib.parse.quote(os.environ["BRIDGE_TOKEN"], safe="")
          url = (
              "https://seldrune-platform.onrender.com"
              "/api/v1/internal/astra-runpod-review?token=" + token
          )
          with urllib.request.urlopen(url, timeout=180) as response:
              body = response.read().decode("utf-8")
              print(body)
          PY
