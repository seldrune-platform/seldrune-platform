name: Build LiveShell WebRTC gateway image

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile.webrtc-gateway
      - services/live_media/**
      - .github/workflows/webrtc-gateway-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile.webrtc-gateway
      - services/live_media/**
      - .github/workflows/webrtc-gateway-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Seldrune
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the LiveShell WebRTC gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.webrtc-gateway
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/seldrune-liveshell-webrtc-gateway:latest
            ghcr.io/${{ github.repository_owner }}/seldrune-liveshell-webrtc-gateway:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
