name: Publish private RunPod FaceSwap worker image

on:
  push:
    branches:
      - main
      - codex/media-face-transform-1080p30
    paths:
      - services/live_media/Dockerfile.runpod
      - services/live_media/runpod_facefusion_worker.py
      - .github/workflows/runpod-worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim disk space for CUDA image build
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /opt/az \
            /opt/microsoft \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/lib/llvm-* \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /home/runner/.cache
          sudo docker system prune --all --force
          df -h /

      - name: Check out Seldrune
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/seldrune-faceswap-worker:sha-${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/seldrune-faceswap-worker:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/live_media/Dockerfile.runpod
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
